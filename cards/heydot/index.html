<style>

  padding:19px 34px 23px;font-family:SFRounded,ui-rounded,system-ui,sans-serif;font-optical-sizing:auto;font-weight:600;font-size:34px;letter-spacing:-0.01em;white-space:nowrap;line-height:1.1;overflow:hidden}

/* Desktop pieces */

  background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 50%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08))}

<body>
<div class="card">
  <section class="hero" id="hero" aria-label="HeyDot: the banner's mic dot is recoloured in the dot designer, moves to the menu bar, and a spoken &quot;Hey Dot&quot; starts a call"></section>
  <section class="panel">
    <div class="row"><h2>HeyDot</h2></div>
    <p>A menu bar app: say “Hey Dot” from across the room and your ChatGPT dot starts a voice call.</p>
    <div class="meta"><span>macOS</span><span>On-device wake word</span><time>NOV 2026</time></div>
  </section>
</div>
<script src="layers.js"></script>
<script>
// ======================= Colour: OKLCH, as Kit/UI/Theme.swift and the banner kit =======================
const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
const gam = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055);
function oklch(hex) {
  const n = parseInt(hex.slice(1), 16), r = lin(n >> 16 & 255), g = lin(n >> 8 & 255), b = lin(n & 255);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
  return { l: L, c: Math.hypot(A, B), h: ((Math.atan2(B, A) * 180) / Math.PI + 360) % 360 };
}
function rgbOf(L, C, H) {
  const a = C * Math.cos(H * Math.PI / 180), b = C * Math.sin(H * Math.PI / 180);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3, s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
}
function hexOf(L, C, H) {
  let c = C, rgb = rgbOf(L, c, H);
  while (rgb.some(v => v < -1e-4 || v > 1 + 1e-4) && c > 0) { c -= 0.002; rgb = rgbOf(L, Math.max(c, 0), H); }
  return '#' + rgb.map(v => Math.round(Math.min(1, Math.max(0, gam(Math.min(1, Math.max(0, v))))) * 255).toString(16).padStart(2, '0')).join('');
}
const VIOLET = '#7b61ff', PINK = '#ff5fa2';   // DotDesign.swift DotColor.violet / .pink
const OV = oklch(VIOLET), OP = oklch(PINK);
const lum = hex => { const n = parseInt(hex.slice(1), 16); return 0.2126 * lin(n >> 16 & 255) + 0.7152 * lin(n >> 8 & 255) + 0.0722 * lin(n & 255); };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const rgba = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;
const a2 = (v) => Math.round(Math.min(255, v)).toString(16).padStart(2, '0');

// The whole theme is a function of one parameter: th = 0 is the logo's violet, th = 1 is pink.
// The dot colour is interpolated in OKLCH (hue the short way, through orchid), so no midpoint goes grey.
function theme(th) {
  let dh = OP.h - OV.h; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  const l = OV.l + (OP.l - OV.l) * th, c = OV.c + (OP.c - OV.c) * th, h = (OV.h + dh * th + 360) % 360;
  const body = th <= 0 ? VIOLET : th >= 1 ? PINK : hexOf(l, c, h);
  const feature = hexOf(0.25, Math.min(0.075, c * 0.45 + 0.02), h), fo = oklch(feature);
  const ink = hexOf(0.16, 0.02, h);
  // Accent.label: white at 4.5:1, else hue-tinted ink at 4.5:1, else white. Blended through the switch.
  const label = contrast(body, '#ffffff') >= 4.5 ? '#ffffff' : contrast(body, ink) >= 4.5 ? ink : '#ffffff';
  const markUI = contrast(body, '#f6f5fa') >= 3 ? body : hexOf(0.58, Math.min(c, 0.2), h);
  return {
    l, c, h, body, label, markUI, ink,
    top: hexOf(Math.min(0.985, l + 0.09), c * 0.8, h), bottom: hexOf(Math.max(0.2, l - 0.08), Math.min(0.37, c * 1.08), h),
    feature, featureTop: hexOf(Math.min(0.6, fo.l + 0.09), fo.c, fo.h), shadow: hexOf(0.22, Math.min(0.1, c), h),
    // r4 wash(), light, k = 1, centred on the banner's mic dot.
    lead: hexOf(Math.min(0.9, Math.max(0.82, l)), Math.min(c, 0.17), h), blue: hexOf(0.8, 0.09, h - 40), amber: hexOf(0.86, 0.11, h + 150),
    base: hexOf(0.985, 0.006, h), even: hexOf(0.94, 0.04, h),
    // Frost blobs for windows and the popover (Theme.swift backdrop, light).
    fLead: hexOf(Math.min(0.9, Math.max(0.77, l)), Math.min(c, 0.17), h), fS1: hexOf(0.79, 0.09, h + 150), fS2: hexOf(0.79, 0.09, h - 40),
    // Banner copy and bubbles (r2/r5).
    textInk: hexOf(0.2, 0.035, h), sub: hexOf(0.46, 0.04, h), mark: hexOf(0.5, 0.21, h), chip: hexOf(0.36, 0.13, h),
    heroFill: hexOf(0.52, 0.22, h), heroShadow: hexOf(0.3, 0.15, h) + '40', otherText: hexOf(0.22, 0.035, h), otherShadow: hexOf(0.25, 0.08, h) + '30',
  };
}
const THEME_V = theme(0), THEME_P = theme(1);

// ======================= Timeline =======================
const LOOP = 13000;
// One ordered list of named cues (ms). Every effect below is written relative to its cause's cue.
const cue = {
  leave: 1400,        // banner copy and bubbles step aside
  micToTile: 1550,    // the mic dot carries into the designer's preview tile (900 ms)
  cursorIn: 2500,
  clickPink: 3300,    // cursor presses the pink swatch
  clickSave: 4600,
  lift: 4800,         // the saved dot leaves the tile for the menu bar (800 ms)
  land: 5600,         // the dot is the menu bar icon
  hey: 6500,          // "Hey…"
  heyDot: 7200,       // "Hey Dot"
  wake: 7850,         // wake phrase detected: badge, then the call starts
  reply: 8500,        // the dot answers
  back: 10000,        // popover closes; everything returns to the banner
  home: 11300,        // banner complete; holds to the seam
};
const clamp01 = x => Math.max(0, Math.min(1, x));
const span = (t, a, d) => clamp01((t - a) / d);
const easeIO = p => p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2;
const easeOut = p => 1 - (1 - p) ** 3;
const easeIn = p => p * p * p;
const easeBack = p => { const s = 1.4; return 1 + (s + 1) * (p - 1) ** 3 + s * (p - 1) ** 2; };
const lerp = (a, b, p) => a + (b - a) * p;
const smooth = p => p * p * (3 - 2 * p);

// ======================= Geometry =======================
const L = window.LAYERS;
const K = 630 / 640, OX = (1200 - 1280 * K) / 2;        // cover-fit 1280x640 banner space into the 1200x630 hero
const toC = (x, y) => [x * K + OX, y * K];
const MIC_BANNER = { x: toC(L.hero.x, 0)[0], y: L.hero.y * K, s: L.hero.size * K };
const MIC_TILE = { x: 150 + 50 + 220 * 13.44 / 96, y: 96 + 130 + 220 * 13.44 / 96, s: 220 * (96 - 2 * 13.44) / 96 };
const MIC_BAR = { x: 1012, y: 7, s: 42 };
const BUB_USER_B = { x: toC(L.speakerBubble.x, 0)[0], y: L.speakerBubble.y * K, s: K };
const BUB_REPLY_B = { x: toC(L.reply.x, 0)[0], y: L.reply.y * K, s: K };
const BUB_USER_TALK = { x: 64, y: 150, s: 1.72 };
const BUB_REPLY_TALK = { x: 96, y: 318, s: 1.56 };

// ======================= Build the scene =======================
const hero = document.getElementById('hero');
let uid = 0;
function el(parent, cls, x, y, html = '', style = '') {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (x !== null) e.style.left = x + 'px';
  if (y !== null) e.style.top = y + 'px';
  if (style) e.style.cssText += style;
  e.innerHTML = html;
  parent.appendChild(e);
  return e;
}

// The lit "glass" dot (kit.mjs litDotSVG), its colours read from CSS variables so one theme drives every copy.
function litDot(dot, { shadowOpacity = 0.45, shadowDrop = 4, shadowBlur = 3.5, gutter = 2.6 } = {}) {
  const i = ++uid, id = p => p + 'L' + i;
  const shape = (s, fill, grow = 0) => s.t === 'fill'
    ? s.el.replace(/\/>$/, ` style="fill:${fill}${grow ? `;stroke:${fill};stroke-width:${grow};stroke-linejoin:round` : ''}"/>`)
    : `<path d="${s.d}" style="fill:none;stroke:${fill};stroke-width:${s.w + grow};stroke-linecap:${s.cap};stroke-linejoin:round"/>`;
  const all = (arr, fill, grow) => arr.map(s => shape(s, fill, grow)).join('');
  const bb = dot.box;
  return `<svg viewBox="0 0 96 96"><defs>
<linearGradient id="${id('gb')}" x1="0" y1="${bb[1]}" x2="0" y2="${bb[3]}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--top)"/><stop offset="0.55" style="stop-color:var(--base)"/><stop offset="1" style="stop-color:var(--bottom)"/></linearGradient>
<linearGradient id="${id('ga')}" x1="0" y1="${bb[1]}" x2="0" y2="${bb[3]}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--top)"/><stop offset="0.6" style="stop-color:var(--base)"/><stop offset="1" style="stop-color:var(--bottom)"/></linearGradient>
<linearGradient id="${id('ge')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ftop)"/><stop offset="1" style="stop-color:var(--feat)"/></linearGradient>
<radialGradient id="${id('sp')}" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.75"/><stop offset="0.6" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="${id('rim')}" x1="0" y1="${bb[1]}" x2="0" y2="${bb[3]}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="0.35" stop-color="#fff" stop-opacity="0.12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="${id('bl')}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${shadowBlur}"/></filter>
<mask id="${id('m')}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="136" height="136"><rect x="-20" y="-20" width="136" height="136" fill="#fff"/>${all(dot.addons, '#000', 2 * gutter)}${all(dot.eyes, '#000')}</mask>
<clipPath id="${id('c')}">${dot.body.filter(s => s.t === 'fill').map(s => s.el).join('')}</clipPath></defs>
<g filter="url(#${id('bl')})" opacity="${shadowOpacity}" transform="translate(0 ${shadowDrop})">${all(dot.body, 'var(--shadow)')}${all(dot.addons, 'var(--shadow)')}</g>
<g mask="url(#${id('m')})">${all(dot.body, `url(#${id('gb')})`)}<g clip-path="url(#${id('c')})">
<ellipse cx="${dot.spec[0]}" cy="${dot.spec[1]}" rx="${dot.spec[2]}" ry="${dot.spec[3]}" fill="url(#${id('sp')})" transform="rotate(-24 ${dot.spec[0]} ${dot.spec[1]})"/>
${all(dot.body.slice(0, 1), 'none').replace(/style="fill:none/, `style="fill:none;stroke:url(#${id('rim')});stroke-width:2.2`)}</g></g>
${all(dot.addons, `url(#${id('ga')})`)}
${all(dot.eyes, `url(#${id('ge')})`)}
${dot.glints.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="0.92"/>`).join('')}</svg>`;
}

// Flat dot for the Eyes option cells (DotGeometry: Mic, open cradle), filled from the same variables.
const f2 = n => +n.toFixed(2);
const circleP = (cx, cy, r) => `M${f2(cx - r)} ${f2(cy)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;
const rrect = (x0, y0, x1, y1, r) => `M${x0 + r} ${y0}H${x1 - r}A${r} ${r} 0 0 1 ${x1} ${y0 + r}V${y1 - r}A${r} ${r} 0 0 1 ${x1 - r} ${y1}H${x0 + r}A${r} ${r} 0 0 1 ${x0} ${y1 - r}V${y0 + r}A${r} ${r} 0 0 1 ${x0 + r} ${y0}Z`;
const pill = (cx, cy, w, h) => rrect(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2, Math.min(w, h) / 2);
function arcLine(cx, cy, rx, ry, a0, a1) { let d = ''; for (let i = 0; i <= 48; i++) { const a = (a0 + (a1 - a0) * i / 48) * Math.PI / 180; d += (i ? 'L' : 'M') + f2(cx + rx * Math.cos(a)) + ' ' + f2(cy + ry * Math.sin(a)); } return d; }
const MIC_EXTRAS = [{ d: arcLine(48, 37, 31, 32, 35, 145), stroke: 7.5 }, { d: rrect(44.25, 72.75, 51.75, 85, 1.5) }, { d: pill(48, 88.5, 36, 7.5) }];
function flatMic(eyes) {
  const id = 'f' + (++uid), y = 34, g = 9.5, w = 11, h = 16, inset = 13.33, sc = (96 - 2 * inset) / 96;
  let ep = '', lights = '';
  for (const side of [-1, 1]) {
    const x = 48 + side * g;
    if (eyes === 'oval' || eyes === 'caps') ep += `<path d="${pill(x, y, w, h)}"/>`;
    if (eyes === 'caps') lights += `<path d="${circleP(x - 1.4, y - 4.4, 2.2)}"/>`;
    if (eyes === 'round') { ep += `<path d="${circleP(x, y + 1, 7.3)}"/>`; lights += `<path d="${circleP(x - 2.4, y - 1.6, 2.3)}"/>`; }

  });

  // ---- Badge: the wake phrase was heard ----
  const bIn = easeBack(span(t, cue.wake, 260)), bOut = easeIn(span(t, cue.back - 100, 150));
  set(badge, 'opacity', (clamp01(bIn * 1.5) * (1 - bOut)).toFixed(3));
  set(badge, 'transform', `scale(${(0.5 + 0.5 * bIn).toFixed(4)})`);

  // ---- "Hey…" -> "Hey Dot" ----
  // Banner: shows "Hey Dot" at its banner spot. Leaves with the copy; returns as speech; then travels home.
  const grow = easeOut(span(t, cue.heyDot + 60, 260));
  const ww = t >= cue.hey && t < cue.heyDot ? W1 : t >= cue.heyDot && t < cue.heyDot + 320 ? lerp(W1, W2, grow) : W2;
  set(bUser, 'width', ww.toFixed(2) + 'px');
  set(ell, 'opacity', (t >= cue.hey && t < cue.heyDot + 80 ? 1 - span(t, cue.heyDot, 80) : 0).toFixed(3));
  set(dt, 'opacity', (t >= cue.hey && t < cue.heyDot + 320 ? easeOut(span(t, cue.heyDot + 120, 200)) : 1).toFixed(3));
  set(bUser, 'color', T.otherText);
  set(bUser, 'filter', `drop-shadow(0 12px 20px ${T.otherShadow})`);
  if (t < cue.hey) {
    const p = easeIn(span(t, cue.leave, 300));
    bubbleAt(bUser, BUB_USER_B, W2, BH, 1 - 0.15 * p, 1 - p);
  } else if (t < cue.back + 350) {
    const p = easeBack(span(t, cue.hey, 340));
    bubbleAt(bUser, BUB_USER_TALK, ww, BH, 0.82 + 0.18 * p, clamp01(span(t, cue.hey, 100)));
  } else {
    const p = easeIO(span(t, cue.back + 350, 850));
    bubbleAt(bUser, { x: lerp(BUB_USER_TALK.x, BUB_USER_B.x, p), y: lerp(BUB_USER_TALK.y, BUB_USER_B.y, p) - 40 * Math.sin(Math.PI * p), s: lerp(BUB_USER_TALK.s, BUB_USER_B.s, p) }, W2, BH, 1, 1);
  }

  // ---- The dot's reply ----
  const rf = T.heroFill;
  if (bReply.__fill !== rf) { bReply.__fill = rf; bReply.style.borderImageSource = bubbleSrc(rf); }
  set(bReply, 'color', '#ffffff');
  set(bReply, 'filter', `drop-shadow(0 12px 20px ${T.heroShadow})`);
  if (t < cue.reply) {
    const p = easeIn(span(t, cue.leave, 300));
    bubbleAt(bReply, BUB_REPLY_B, WR, HR, 1 - 0.15 * p, 1 - p);
  } else if (t < cue.back + 250) {
    const p = easeBack(span(t, cue.reply, 340));
    bubbleAt(bReply, BUB_REPLY_TALK, WR, HR, 0.82 + 0.18 * p, clamp01(span(t, cue.reply, 100)));
  } else {
    const p = easeIO(span(t, cue.back + 250, 900));
    bubbleAt(bReply, { x: lerp(BUB_REPLY_TALK.x, BUB_REPLY_B.x, p), y: lerp(BUB_REPLY_TALK.y, BUB_REPLY_B.y, p) - 30 * Math.sin(Math.PI * p), s: lerp(BUB_REPLY_TALK.s, BUB_REPLY_B.s, p) }, WR, HR, 1, 1);
  }
};
window.__frame(0);
</script>
